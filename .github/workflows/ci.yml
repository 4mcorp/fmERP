name: CI

# dev PR: 기능별 단위 테스트 선택 + 전체 통합 테스트(주입된 기능 간 계약 포함). 정적 게이트는 항상 실행.
# dev PR: core smoke + 영향 E2E(공유·불명 경로는 전체), main PR: 전체 E2E.
# check는 필요한 E2E 잡·리포트·게이트 누락도 실패시킨다.
on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      features: ${{ steps.scope.outputs.features }}
      core: ${{ steps.scope.outputs.core }}
      e2e: ${{ github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/changed-features.sh
      - name: 변경 감지·결과 집계 회귀 테스트
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v

  # 정적 게이트: 저장소 전체 기준이라 항상 돌린다 (arch:guard 래칫 포함)
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # arch:guard가 한도(tools/baselines/limits.json)를 비교할 기준 커밋. 한도를 올리는 PR은 여기서 실패한다
      GUARD_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 기준 커밋과 비교하려면 이력이 필요하다
      - uses: pnpm/action-setup@v6 # package.json의 packageManager 사용
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 격리 러너·Compose CLI 계약 테스트
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 -m unittest discover -s deploy/k8s/test -p 'test_*.py' -v
          python3 -m unittest discover -s deploy/e2e -p 'test_*.py' -v

      - name: 린트 (Biome)
        run: pnpm exec tsx tools/src/cli/run-gate.ts biome -- pnpm exec biome ci .
      - name: 타입 검사
        run: pnpm exec tsx tools/src/cli/run-gate.ts typecheck -- pnpm typecheck
      # 기능 경계·순환·미사용 코드·억제 주석을 기준선과 비교한다 (래칫)
      - name: 구조 검사 (arch:check)
        run: pnpm exec tsx tools/src/cli/run-gate.ts arch-check -- pnpm arch:check
      - name: 규칙 약화 감지 (arch:guard)
        run: pnpm exec tsx tools/src/cli/run-gate.ts arch-guard -- pnpm arch:guard

      - name: 품질 리포트
        if: always()
        run: pnpm quality:report
      - name: 품질 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report-static
          path: artifacts
          retention-days: 30

  # 기능별 단위 테스트. 통합 테스트는 test-integration에서 한 번만 실행한다.
  test-feature:
    needs: scope
    if: needs.scope.outputs.features != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJSON(needs.scope.outputs.features) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # PDF 변환 시험(features/completion/tests/render.test.ts)만 Chromium이 필요하다
      - name: 브라우저 설치 (Playwright Chromium)
        if: matrix.feature == 'completion'
        run: pnpm --filter @fmerp/web exec playwright install --with-deps chromium

      - name: 기능 테스트 (${{ matrix.feature }})
        run: pnpm exec tsx tools/src/cli/run-gate.ts test-${{ matrix.feature }} -- pnpm exec vitest run --project unit features/${{ matrix.feature }}/

      - name: 품질 리포트
        if: always()
        run: pnpm quality:report
      - name: 품질 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report-${{ matrix.feature }}
          path: artifacts
          retention-days: 30

  # 기능 밖 단위 테스트(shared·packages·apps·tools). 서비스 기동은 불필요하다.
  test-core:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 코어 단위 테스트
        run: pnpm exec tsx tools/src/cli/run-gate.ts test-core -- pnpm exec vitest run --project unit apps/ packages/ shared/ tools/

      - name: 품질 리포트
        if: always()
        run: pnpm quality:report
      - name: 품질 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report-core
          path: artifacts
          retention-days: 30

  # 기능 간 import 없이 app/시험 접점으로 주입되는 의존성도 있으므로 통합은 전체 실행한다.
  test-integration:
    needs: scope
    if: needs.scope.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 테스트 서비스 기동
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres-test s3
      - name: 전체 통합 테스트
        run: pnpm exec tsx tools/src/cli/run-gate.ts test-integration -- pnpm exec vitest run --project integration
      - name: 품질 리포트
        if: always()
        run: pnpm quality:report
      - name: 품질 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report-integration
          path: artifacts
          if-no-files-found: error
          retention-days: 30

  # dev·main 모두 기존 필수 check가 E2E의 실패·취소·누락을 확인한다.
  e2e:
    if: github.event_name == 'pull_request' && (github.base_ref == 'dev' || github.base_ref == 'main')
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
    with:
      full: ${{ github.base_ref != 'dev' }}
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}

  # 안정적인 필수 체크: 예상된 skip만 허용하고 선택된 잡·게이트의 누락도 실패시킨다.
  check:
    needs: [scope, static, test-feature, test-core, test-integration, e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: quality-report-*
          path: downloaded
      - name: 결과·게이트 집계
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci-result.py
      - name: 최종 품질 리포트 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-report
          path: artifacts/quality-report.json
          if-no-files-found: error
          retention-days: 30
