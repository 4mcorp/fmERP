name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # package.json의 packageManager(pnpm@11.28.3) 사용

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 린트 (Biome)
        run: pnpm exec biome ci .

      - name: 타입 검사
        run: pnpm typecheck

      # 통합·E2E 테스트는 테스트 DB(55433)를 매번 초기화·시드해서 쓴다 (vitest.config.ts, apps/web/e2e/test-env.ts)
      - name: 테스트 서비스 기동 (PostgreSQL 18 테스트 DB, SeaweedFS)
        run: docker compose -f docker-compose.dev.yml up -d --wait postgres-test s3

      - name: 단위·통합 테스트
        run: pnpm test

      - name: E2E 준비 (브라우저 설치)
        run: pnpm --filter @fmerp/web exec playwright install --with-deps chromium

      - name: E2E 테스트
        run: pnpm test:e2e

      - name: 실패 시 Playwright 리포트 보관
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results
          retention-days: 7
