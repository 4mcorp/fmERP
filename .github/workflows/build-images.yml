name: Build images

# dev·main 푸시 때 web·worker·web-builder 이미지를 빌드해 GHCR(ghcr.io/4mcorp)에 올린다.
# 태그: <브랜치>-<run_number>-<sha7>  (예: dev-123-9751deb). run_number가 단조 증가해 Flux ImagePolicy가 최신을 고른다.
# 배포는 이 워크플로가 하지 않는다. infra 저장소의 Flux image automation이 새 태그를 감지해 적용한다 (docs/ops/k8s.md).
# web을 마지막에 올린다: Flux는 web 저장소의 태그를 보고 세 이미지에 같은 태그를 쓰므로, web이 보이면 나머지는 이미 있어야 한다.

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: build-images-${{ github.ref_name }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/4mcorp

jobs:
  build:
    name: 이미지 빌드·푸시
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: 태그 계산
        id: meta
        run: |
          case "$GITHUB_REF_NAME" in
            dev|main) ;;
            *) echo "::error::dev·main 에서만 빌드한다 ($GITHUB_REF_NAME)"; exit 1 ;;
          esac
          echo "tag=${GITHUB_REF_NAME}-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: web-builder (migrate 잡용)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: builder
          push: true
          tags: ${{ env.REGISTRY }}/fmerp-web-builder:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web-builder
          cache-to: type=gha,mode=max,scope=web-builder

      - name: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/fmerp-worker:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: web (마지막. Flux가 이 태그를 감시한다)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          target: runner
          push: true
          tags: ${{ env.REGISTRY }}/fmerp-web:${{ steps.meta.outputs.tag }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
