name: Automerge dev

# dev 대상 PR이 CI(check)·policy를 통과하고 충돌이 없으면 squash 병합하고 브랜치를 지운다.
# main 대상 PR은 절대 건드리지 않는다(사람이 검증 후 병합). 보호 경로(CODEOWNERS)를 바꾸는 PR도 사람이 병합한다.
# GitHub 자체 auto-merge는 Free 비공개 저장소에서 쓸 수 없어, 완료된 워크플로 이벤트로 직접 병합한다.

on:
  workflow_run:
    workflows: [CI, Policy]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write   # 병합 후 build-images 를 workflow_dispatch 로 호출 (push 이벤트는 GITHUB_TOKEN 병합에서 워크플로를 깨우지 않는다)

jobs:
  merge:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: 조건 확인 후 병합
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN || github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          pr=$(gh api "repos/$REPO/commits/$SHA/pulls" --jq '[.[] | select(.state=="open" and .base.ref=="dev")][0].number // empty')
          [ -n "$pr" ] || { echo "dev 대상 열린 PR 없음"; exit 0; }

          info=$(gh pr view "$pr" --json isDraft,headRefOid,mergeable,labels)
          [ "$(jq -r .isDraft <<<"$info")" = "false" ] || { echo "draft PR: 건너뜀"; exit 0; }
          [ "$(jq -r .headRefOid <<<"$info")" = "$SHA" ] || { echo "새 push가 있어 건너뜀"; exit 0; }
          if jq -e '.labels[].name | select(.=="no-automerge")' <<<"$info" >/dev/null; then echo "no-automerge 라벨: 건너뜀"; exit 0; fi
          [ "$(jq -r .mergeable <<<"$info")" = "MERGEABLE" ] || { echo "충돌 또는 계산 중: 건너뜀"; exit 0; }

          # 필수 검사 두 개가 모두 성공이어야 한다
          for c in check policy; do
            r=$(gh api "repos/$REPO/commits/$SHA/check-runs" --jq "[.check_runs[] | select(.name==\"$c\")] | sort_by(.id) | last | .conclusion // \"none\"")
            [ "$r" = "success" ] || { echo "$c=$r: 아직 병합 조건 아님"; exit 0; }
          done

          # 보호 경로를 바꾸면 사람 검증으로 넘긴다
          owners=$(sed -E 's/[[:space:]]+@.*//; /^#/d; /^$/d' .github/CODEOWNERS)
          files=$(gh pr diff "$pr" --name-only)
          while read -r p; do
            [ -n "$p" ] || continue
            if grep -qE "^/${p#/}|^${p}" <<<"$(sed 's#^#/#' <<<"$files")" 2>/dev/null; then
              echo "보호 경로($p) 변경: 사람이 병합"; gh pr comment "$pr" --body "보호 경로 변경이라 자동병합하지 않습니다. 사람이 검토 후 병합해 주세요." || true; exit 0
            fi
          done <<<"$owners"

          gh pr merge "$pr" --squash --delete-branch --match-head-commit "$SHA"

          # 이미지 빌드 호출. 이미지 입력 변경이 없으면 build-images 의 changes 잡이 건너뛴다
          gh workflow run build-images.yml --repo "$REPO" --ref dev
