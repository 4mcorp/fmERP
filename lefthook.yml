# Git hook (결정 P3). 설치는 pnpm install 시 prepare 스크립트가 처리한다.
pre-commit:
  commands:
    biome:
      glob: "*.{js,mjs,cjs,ts,tsx,jsx,json,jsonc,css}"
      run: node_modules/.bin/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: node_modules/.bin/commitlint --edit {1}

# 푸시 전 구조 검사: 새 위반(기능 경계·순환·미사용 코드·억제 주석)과 규칙 약화를 막는다 (docs/plan/2026-10-06-feature-architecture-refactor.md)
pre-push:
  commands:
    arch-check:
      run: node_modules/.bin/tsx tools/src/cli/arch-check.ts
    arch-guard:
      run: node_modules/.bin/tsx tools/src/cli/guard.ts
