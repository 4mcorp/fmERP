# 통합 테스트 전용 DB. 메모리(emptyDir Memory)에 두어 빠르고, 파드가 내려가면 사라진다 (ADR 0004)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-test
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: postgres-test}
  template:
    metadata:
      labels: {app: postgres-test}
    spec:
      containers:
        - name: postgres
          image: postgres:18-bookworm
          env:
            - {name: POSTGRES_PASSWORD, value: postgres}
            - {name: POSTGRES_DB, value: fmerp}
          ports:
            - {name: pg, containerPort: 5432}
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, fmerp]
            periodSeconds: 3
            failureThreshold: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
            - {name: initdb, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: data
          emptyDir: {medium: Memory, sizeLimit: 512Mi}
        - name: initdb
          configMap:
            name: fmerp-postgres-initdb
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-test
spec:
  selector: {app: postgres-test}
  ports:
    - {name: pg, port: 5432, targetPort: pg}
