# 기능 지도 초안 (계획 5장). P8에서 형식을 확정하고 CI가 정합성을 검사한다.
id: account
summary: 로그인(개발용 시드 로그인·Better Auth)·세션, 회사 만들기·전환, 초대 수락, 내 정보(프로필·결재 PIN·세션·로그인 이력)
keywords: [로그인, 계정, 세션, 초대, 온보딩, 회사 전환, PIN, 프로필, 서명, 도장, 로그인 이력]
access:
  - { who: 누구나, path: "/login, /dev-login(개발 전용)", entry: ui/pages/login }
  - { who: 초대받은 사용자, path: "/invite/{token}", entry: ui/pages/invite }
  - { who: 소속 없는 사용자, path: "/onboarding (회사 만들기·초대 수락)", entry: ui/pages/onboarding }
  - { who: 모든 구성원, path: "사용자 메뉴 → 내 정보 → /me", entry: ui/components/me-page }
screens:
  - { route: /login, file: src/ui/pages/login.tsx }
  - { route: /dev-login, file: src/ui/pages/dev-login.tsx }
  - { route: "/invite/[token]", file: src/ui/pages/invite.tsx }
  - { route: /onboarding, file: src/ui/pages/onboarding.tsx }
  - { route: /me, file: src/ui/components/me-page.tsx }   # 알림 탭은 합성 루트가 슬롯으로 끼운다
adapters:
  - apps/web/app/login/page.tsx
  - apps/web/app/dev-login/page.tsx
  - apps/web/app/(app)/invite/[token]/page.tsx
  - apps/web/app/(app)/onboarding/page.tsx
  - apps/web/app/(app)/me/page.tsx
api: { generated: true, entry: api/routes }       # registerAccountApi(router, deps, provisioning{installDefaultForms,installDefaultPositions}) — 순서 주의: org의 구성원 라우트보다 먼저
auth_setup: auth-setup                            # 합성 루트가 createAuth·resolveDevTestLogin을 가져가는 진입점
seed: apps/web/server/seed/                       # 시드 계정·시험 조직은 합성 루트가 가진다(account·org·approval 표를 함께 채움). 이 기능은 test-accounts 진입점만 낸다
tables:
  owns: { generated: true }                       # user·session·account·membership 등 인증 표 (P7에서 @owner로 채움)
  reads: [assignment, business, department, duty, position]   # 내 회사 목록·내 정보가 소속·조직 이름을 읽는다
events: { publishes: [], consumes: [] }
contracts:
  - shared/authz                                  # errors·session-guard·membership·reauth (공통)
  - shared/server/deps (AuthHandle)               # ServerDeps.auth는 불투명 처리기, authOf로 좁힌다
  - shared/contracts/system-guards
tests:
  unit: tests/*.test.ts
  int: tests/account.int.test.ts
  e2e: apps/web/e2e/m1.spec.ts
invariants:
  - 세션은 유휴·절대 만료 정책을 적용하고 만료된 세션은 지운다
  - PIN은 해시로만 저장하고 5회 실패 시 15분 잠근다
  - 초대 토큰은 해시만 저장하고 한 번만 쓴다
